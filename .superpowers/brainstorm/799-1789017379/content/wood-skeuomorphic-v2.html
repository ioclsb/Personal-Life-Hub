<h2>个人生活台 — 拟物木纹 v2</h2>
<p class="subtitle">点击任意方块，子主题出现在其下方</p>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .phone-frame {
    width: 375px;
    margin: 0 auto;
    background: #2c2c2c;
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .phone-screen {
    background: #d6c8a8;
    border-radius: 16px;
    overflow: hidden;
    padding: 16px 12px 20px;
  }

  .header {
    text-align: center;
    padding: 8px 0 14px;
  }
  .header-title {
    font-size: 19px;
    font-weight: 700;
    color: #5a4632;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .header-sub {
    font-size: 10px;
    color: #9a8a70;
    letter-spacing: 2px;
    margin-top: 2px;
  }

  /* ——— 木纹表面 ——— */
  .wood-surface {
    background:
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(180,150,110,0.12) 2px,
        rgba(180,150,110,0.12) 3px
      ),
      repeating-linear-gradient(
        88deg,
        transparent,
        transparent 5px,
        rgba(160,130,90,0.08) 5px,
        rgba(160,130,90,0.08) 6px
      ),
      radial-gradient(ellipse 80% 100% at 20% 50%, rgba(210,185,145,0.25), transparent),
      radial-gradient(ellipse 60% 100% at 75% 50%, rgba(195,165,120,0.2), transparent),
      radial-gradient(ellipse 90% 80% at 50% 30%, rgba(220,195,155,0.15), transparent),
      linear-gradient(180deg, #ddc9a5 0%, #d4bc98 30%, #ccb08a 60%, #d8c4a0 100%);
  }

  /* ——— 立体浮雕 ——— */
  .wood-3d {
    border: 1px solid rgba(0,0,0,0.08);
    border-top-color: rgba(255,255,255,0.35);
    border-left-color: rgba(255,255,255,0.25);
    border-bottom-color: rgba(0,0,0,0.12);
    border-right-color: rgba(0,0,0,0.06);
    box-shadow:
      0 2px 3px rgba(0,0,0,0.1),
      0 4px 6px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -1px 2px rgba(0,0,0,0.08),
      inset 1px 0 0 rgba(255,255,255,0.2),
      inset -1px 0 0 rgba(0,0,0,0.04);
  }

  /* ——— 主题方块 ——— */
  .main-block {
    border-radius: 10px;
    padding: 28px 14px 16px;
    min-height: 130px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .main-block:active {
    transform: scale(0.97);
  }
  .main-block .block-icon {
    font-size: 26px;
    margin-bottom: 6px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
  }
  .main-block .block-label {
    font-size: 17px;
    font-weight: 700;
    color: #5a4632;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .main-block .block-hint {
    font-size: 10px;
    color: #9a8a70;
    margin-top: 2px;
  }

  /* ——— 子主题木条 ——— */
  .sub-bar {
    border-radius: 8px;
    padding: 11px 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sub-bar:active {
    transform: scale(0.97);
  }
  .sub-bar .bar-label {
    font-size: 13.5px;
    font-weight: 600;
    color: #5a4632;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .sub-bar .bar-arrow {
    font-size: 11px;
    color: #a09080;
  }

  /* ——— 布局：每行两个方块，点击后子条插入下方 ——— */
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .row-with-subs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 10px;
  }
  /* 左侧方块 + 子条占左列 */
  .left-with-subs {
    grid-column: 1;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .left-with-subs .main-block {
    min-height: 130px;
  }
  /* 右侧方块保持原位 */
  .right-only {
    grid-column: 2;
    grid-row: 1 / 3;
  }

  .sub-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .gap-bottom {
    margin-bottom: 10px;
  }

  /* 状态点 */
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
  }
  .dot-green { background: #6ab04c; }
  .dot-blue { background: #4a90d9; }
  .dot-orange { background: #e8a838; }
  .dot-purple { background: #9b59b6; }
</style>

<div class="phone-frame">
  <div class="phone-screen">

    <div class="header">
      <div class="header-title">我的生活台</div>
      <div class="header-sub">PERSONAL LIFE HUB</div>
    </div>

    <!-- 第一行：衣食住行（展开中） + 个人成长 -->
    <div class="row-with-subs gap-bottom">
      <!-- 左列：衣食住行 + 展开的子条 -->
      <div class="left-with-subs">
        <div class="main-block wood-surface wood-3d">
          <div class="block-icon">🏠</div>
          <div class="block-label">衣食住行</div>
          <div class="block-hint">日常生活管理</div>
        </div>
        <div class="sub-list">
          <div class="sub-bar wood-surface wood-3d">
            <span class="bar-label"><span class="status-dot dot-green"></span>衣橱管理</span>
            <span class="bar-arrow">›</span>
          </div>
          <div class="sub-bar wood-surface wood-3d">
            <span class="bar-label"><span class="status-dot dot-blue"></span>生活消耗</span>
            <span class="bar-arrow">›</span>
          </div>
          <div class="sub-bar wood-surface wood-3d">
            <span class="bar-label"><span class="status-dot dot-orange"></span>食材库存</span>
            <span class="bar-arrow">›</span>
          </div>
          <div class="sub-bar wood-surface wood-3d">
            <span class="bar-label"><span class="status-dot dot-purple"></span>出行清单</span>
            <span class="bar-arrow">›</span>
          </div>
        </div>
      </div>
      <!-- 右列：个人成长（未展开） -->
      <div class="right-only">
        <div class="main-block wood-surface wood-3d" style="height:100%;">
          <div class="block-icon">🌱</div>
          <div class="block-label">个人成长</div>
          <div class="block-hint">习惯与目标</div>
        </div>
      </div>
    </div>

    <!-- 第二行：未来计划 + 学习思考 -->
    <div class="row gap-bottom">
      <div class="main-block wood-surface wood-3d">
        <div class="block-icon">📅</div>
        <div class="block-label">未来计划</div>
        <div class="block-hint">规划与提醒</div>
      </div>
      <div class="main-block wood-surface wood-3d">
        <div class="block-icon">📖</div>
        <div class="block-label">学习思考</div>
        <div class="block-hint">知识与记录</div>
      </div>
    </div>

  </div>
</div>
