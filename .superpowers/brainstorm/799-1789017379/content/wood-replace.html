<h2>个人生活台 — 母主题替换为子主题</h2>
<p class="subtitle">点击母主题后，母主题消失，子主题直接呈现</p>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #d6c8a8; }

  .phone-frame {
    width: 375px;
    height: 750px;
    margin: 0 auto;
    background: #2c2c2c;
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .phone-screen {
    background: #d6c8a8 !important;
    border-radius: 16px;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    padding: 12px;
  }

  /* 木纹表面 */
  .wood-surface {
    background:
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(180,150,110,0.12) 2px,
        rgba(180,150,110,0.12) 3px
      ),
      repeating-linear-gradient(
        88deg,
        transparent,
        transparent 5px,
        rgba(160,130,90,0.08) 5px,
        rgba(160,130,90,0.08) 6px
      ),
      radial-gradient(ellipse 80% 100% at 20% 50%, rgba(210,185,145,0.25), transparent),
      radial-gradient(ellipse 60% 100% at 75% 50%, rgba(195,165,120,0.2), transparent),
      radial-gradient(ellipse 90% 80% at 50% 30%, rgba(220,195,155,0.15), transparent),
      linear-gradient(180deg, #ddc9a5 0%, #d4bc98 30%, #ccb08a 60%, #d8c4a0 100%);
  }

  /* 立体浮雕 */
  .wood-3d {
    border: 1px solid rgba(0,0,0,0.08);
    border-top-color: rgba(255,255,255,0.35);
    border-left-color: rgba(255,255,255,0.25);
    border-bottom-color: rgba(0,0,0,0.12);
    border-right-color: rgba(0,0,0,0.06);
    box-shadow:
      0 2px 3px rgba(0,0,0,0.1),
      0 4px 6px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -1px 2px rgba(0,0,0,0.08),
      inset 1px 0 0 rgba(255,255,255,0.2),
      inset -1px 0 0 rgba(0,0,0,0.04);
  }

  /* 网格单元格 */
  .cell {
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  /* 母主题 */
  .main-block {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    padding: 28px 16px 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 2;
  }
  .main-block.hidden {
    opacity: 0;
    transform: scale(0.9);
    pointer-events: none;
  }
  .main-block:active {
    transform: scale(0.97);
  }
  .block-icon {
    font-size: 30px;
    margin-bottom: 6px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
  }
  .block-label {
    font-size: 18px;
    font-weight: 700;
    color: #5a4632;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .block-hint {
    font-size: 10px;
    color: #9a8a70;
    margin-top: 2px;
  }

  /* 子主题列表 */
  .sub-list {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 8px;
    opacity: 0;
    transform: scale(0.9);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .sub-list::-webkit-scrollbar { display: none; }
  .sub-list.show {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* 子主题木条 */
  .sub-bar {
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .sub-bar:active {
    transform: scale(0.96);
  }
  .bar-label {
    font-size: 13px;
    font-weight: 600;
    color: #5a4632;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .bar-arrow {
    font-size: 11px;
    color: #a09080;
  }

  /* 点击提示 */
  .tap-hint {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 9px;
    color: #b0a090;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 3;
  }
  .cell:hover .tap-hint {
    opacity: 1;
  }
</style>

<div class="phone-frame">
  <div class="phone-screen">

    <!-- 衣食住行 -->
    <div class="cell">
      <div class="main-block wood-surface wood-3d" id="mb1" onclick="showSub('sub1','mb1')">
        <div class="block-icon">🏠</div>
        <div class="block-label">衣食住行</div>
        <div class="block-hint">日常生活管理</div>
      </div>
      <div class="sub-list wood-surface wood-3d" id="sub1">
        <div class="sub-bar"><span class="bar-label">衣橱管理</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">生活消耗</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">食材库存</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">出行清单</span><span class="bar-arrow">›</span></div>
      </div>
    </div>

    <!-- 个人成长 -->
    <div class="cell">
      <div class="main-block wood-surface wood-3d" id="mb2" onclick="showSub('sub2','mb2')">
        <div class="block-icon">🌱</div>
        <div class="block-label">个人成长</div>
        <div class="block-hint">习惯与目标</div>
      </div>
      <div class="sub-list wood-surface wood-3d" id="sub2">
        <div class="sub-bar"><span class="bar-label">每日打卡</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">习惯追踪</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">目标进度</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">成长日志</span><span class="bar-arrow">›</span></div>
      </div>
    </div>

    <!-- 未来计划 -->
    <div class="cell">
      <div class="main-block wood-surface wood-3d" id="mb3" onclick="showSub('sub3','mb3')">
        <div class="block-icon">📅</div>
        <div class="block-label">未来计划</div>
        <div class="block-hint">规划与提醒</div>
      </div>
      <div class="sub-list wood-surface wood-3d" id="sub3">
        <div class="sub-bar"><span class="bar-label">节日生日</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">旅行清单</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">重要证件</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">待办事项</span><span class="bar-arrow">›</span></div>
      </div>
    </div>

    <!-- 学习思考 -->
    <div class="cell">
      <div class="main-block wood-surface wood-3d" id="mb4" onclick="showSub('sub4','mb4')">
        <div class="block-icon">📖</div>
        <div class="block-label">学习思考</div>
        <div class="block-hint">知识与记录</div>
      </div>
      <div class="sub-list wood-surface wood-3d" id="sub4">
        <div class="sub-bar"><span class="bar-label">书影音 · 豆瓣</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">收藏夹</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">学习笔记</span><span class="bar-arrow">›</span></div>
        <div class="sub-bar"><span class="bar-label">灵感碎片</span><span class="bar-arrow">›</span></div>
      </div>
    </div>

  </div>
</div>

<script>
function showSub(subId, mbId) {
  document.getElementById(mbId).classList.add('hidden');
  document.getElementById(subId).classList.add('show');
}
</script>
