<style>

  .entry-editor.expanded .entry-fields { flex: 0 0 auto; }

  .year-field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .year-field-grid input { width: 100%; height: 34px; margin: 0; padding: 6px; color: #5a4632; font: 12px/1 system-ui, sans-serif; text-align: center; }
  .year-field-grid #yearInput { color: #5a4632; font-weight: 800; }
  .year-field-grid #cityInput, .year-field-grid #focusInput { letter-spacing: 1px; }

  .editor-actions { display: flex; gap: 7px; }

  @media (max-width: 430px) { .phone-frame { width: 100%; height: 100vh; border-radius: 0; } }
</style>

<div class="phone-frame"><div class="screen">
  <div class="header"><span class="back">‹</span><span class="title">人生进度</span></div>
  <div class="intro wood-surface wood-3d"><div class="intro-head"><div class="intro-head-actions"><div class="intro-title" id="rangeTitle">1997 · 2026</div><button class="life-duration" id="lifeDurationButton" aria-label="切换出生时长单位"></button><span class="entry-count" id="entryCount">成长记录：0 条</span></div><button class="add-year" id="addYearButton" aria-label="新增年份">＋</button></div><div class="intro-info-row"><div class="intro-subtitle">从出生开始，慢慢收集每一年成为自己的证据</div><div class="life-stats"><span id="currentDate"></span></div></div></div>
  <main class="timeline" id="timeline"></main>
</div></div>

 <div class="modal" id="modal"><div class="editor entry-editor wood-surface wood-3d">
   <h3 id="editorTitle">新增经历</h3>
   <div class="entry-fields"><input id="dateInput" type="date"><input id="entryTitleInput" maxlength="60" placeholder="这一天发生了什么？"></div>
   <textarea id="contentInput" maxlength="1000" placeholder="记录这一段经历、感受或成长"></textarea>
   <button class="entry-expand" id="expandButton" type="button" aria-expanded="false">展开编辑</button>

 </div></div>

 <div class="modal" id="yearModal"><div class="editor year-editor wood-surface wood-3d">
   <h3 id="yearEditorTitle">新增年份</h3>
   <div class="year-field-grid"><input id="yearInput" type="number" min="1900" max="2200" placeholder="年份"><input id="cityInput" maxlength="20" placeholder="城市"><input id="focusInput" maxlength="20" placeholder="重要记录"></div>
   <div class="editor-actions"><button id="yearDeleteButton" hidden>删除</button><button id="yearCancelButton">取消</button><button id="yearSaveButton">保存</button></div>
</div></div>

<script>
var birthDate = '1997-01-15';
var storageKey = 'personal-life-hub-life-timeline-v1';
var returnSub = new URLSearchParams(window.location.search).get('return') || 'sub2a';
var state = loadState();
var editingYear = null;
var editingEntryId = null;
var editingYearOriginal = null;
var audioContext = null;
var markerColors = ['#8d785c', '#b86f52', '#b85149', '#8c9870', '#6f9692', '#71839a', '#8b7893', '#c28b55'];
var starColors = ['#b85149', '#c28b55', '#8c9870', '#6f9692', '#8b7893'];
var durationModes = ['years', 'months', 'weeks', 'days'];
var durationModeIndex = 0;

function loadState() {
  var defaultYears = [];
  for (var year = 1997; year <= 2026; year += 1) defaultYears.push(year);
  try {
    var saved = JSON.parse(localStorage.getItem(storageKey)) || {};
    var hiddenYears = Array.isArray(saved.hiddenYears) ? saved.hiddenYears : [];
    var savedYears = Array.isArray(saved.years) ? saved.years.slice() : [];
    var savedEntries = saved.entries && typeof saved.entries === 'object' ? saved.entries : {};
    Object.keys(savedEntries).forEach(function(year) { var numericYear = Number(year); if (Array.isArray(savedEntries[year]) && savedEntries[year].length && savedYears.indexOf(numericYear) === -1) savedYears.push(numericYear); });
    defaultYears.forEach(function(year) { if (hiddenYears.indexOf(year) === -1 && savedYears.indexOf(year) === -1) savedYears.push(year); });
    return { years: savedYears.length ? savedYears : defaultYears, hiddenYears: hiddenYears, entries: savedEntries, yearInfo: saved.yearInfo || {} };
  } catch (error) { return { years: defaultYears, hiddenYears: [], entries: {}, yearInfo: {} }; }
}
function saveState() { try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (error) {} }
function ageAtYear(year) { return year - Number(birthDate.slice(0, 4)); }
function isBaseYear(year) { return year >= 1997 && year <= 2026; }
function decadeEndColor(year) {
  if (year <= 2007) return '#ead8bc';
  if (year <= 2017) return '#e8d4b7';
  return '#e5d0b0';
}
function yearInfo(year) { return state.yearInfo[year] || { city: '', focus: '', special: false }; }
function yearMarkerColor(year, info) { return info.color || (year === new Date().getFullYear() ? '#b85149' : markerColors[0]); }
function openColorPicker(year, info, picker) {
  document.querySelectorAll('.color-picker.show').forEach(function(openPicker) { openPicker.classList.remove('show'); });
  var selectedColor = yearMarkerColor(year, info);
  picker.innerHTML = '<div class="color-options">' + markerColors.map(function(color) { return '<button class="color-option' + (color === selectedColor ? ' selected' : '') + '" style="background:' + color + '" data-color="' + color + '" aria-label="选择颜色"></button>'; }).join('') + '</div><div class="color-picker-actions"><button class="color-cancel">取消</button><button class="color-confirm">确定</button></div>';
  picker.classList.add('show');
  picker.onclick = function(event) { event.stopPropagation(); };
  picker.querySelectorAll('.color-option').forEach(function(option) {
    option.addEventListener('click', function(event) { event.stopPropagation(); selectedColor = option.dataset.color; picker.querySelectorAll('.color-option').forEach(function(item) { item.classList.toggle('selected', item === option); }); });
  });
  picker.querySelector('.color-cancel').addEventListener('click', function(event) { event.stopPropagation(); picker.classList.remove('show'); });
  picker.querySelector('.color-confirm').addEventListener('click', function(event) { event.stopPropagation(); info.color = selectedColor; state.yearInfo[year] = info; saveState(); render(); });
}
function updateRangeTitle() {
  var allYears = years();
  document.getElementById('rangeTitle').textContent = allYears.length ? Math.min.apply(null, allYears) + ' · ' + Math.max.apply(null, allYears) : '暂无年份';
}
function updateEntryCount() {
  var count = Object.keys(state.entries).reduce(function(total, year) { return total + (Array.isArray(state.entries[year]) ? state.entries[year].length : 0); }, 0);
  document.getElementById('entryCount').textContent = '成长记录：' + count + ' 条';
}
function updateLifeStats() {
  var now = new Date();
  var birth = new Date(Number(birthDate.slice(0, 4)), Number(birthDate.slice(5, 7)) - 1, Number(birthDate.slice(8, 10)));
  var milliseconds = Math.max(0, now.getTime() - birth.getTime());
  var years = now.getFullYear() - birth.getFullYear();
  var birthday = new Date(now.getFullYear(), birth.getMonth(), birth.getDate());
  if (now < birthday) years -= 1;
  var months = (now.getFullYear() - birth.getFullYear()) * 12 + now.getMonth() - birth.getMonth();
  if (now.getDate() < birth.getDate()) months -= 1;
  var values = { years: years, months: months, weeks: Math.floor(milliseconds / 604800000), days: Math.floor(milliseconds / 86400000) };
  var labels = { years: '年', months: '月', weeks: '周', days: '日' };
  document.getElementById('currentDate').textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
  var mode = durationModes[durationModeIndex];
  document.getElementById('lifeDurationButton').textContent = 'Birth ' + values[mode] + ' ' + labels[mode];
}
function years() {
  return state.years.slice().sort(function(a, b) { return b - a; });
}
function playWoodClick() {
  var AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  if (!audioContext) audioContext = new AudioContext();
  if (audioContext.state === 'suspended') audioContext.resume();
  var now = audioContext.currentTime, gain = audioContext.createGain(), tone = audioContext.createOscillator();
  tone.type = 'triangle'; tone.frequency.setValueAtTime(190, now); tone.frequency.exponentialRampToValueAtTime(90, now + 0.09);
  gain.gain.setValueAtTime(0.0001, now); gain.gain.exponentialRampToValueAtTime(0.14, now + 0.004); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
  tone.connect(gain); gain.connect(audioContext.destination); tone.start(now); tone.stop(now + 0.13);
}
function openYear(year) {
  var card = document.querySelector('[data-year="' + year + '"]');
  if (card) card.classList.toggle('open');
}
function openYearEditor(year) {
  editingYearOriginal = year || null;
  if (year) {
    var editingCard = document.querySelector('[data-year="' + year + '"]');
    if (editingCard) editingCard.classList.add('editing-year');
  }
  var info = yearInfo(year);
  document.getElementById('yearInput').value = year || '';
  document.getElementById('cityInput').value = info.city;
  document.getElementById('focusInput').value = info.focus;
  document.getElementById('yearEditorTitle').textContent = year ? '编辑年份' : '新增年份';
  document.getElementById('yearDeleteButton').hidden = !year;
  document.getElementById('yearModal').classList.add('show');
  document.getElementById('yearInput').focus();
}
function closeYearEditor() {
  if (editingYearOriginal) {
    var editingCard = document.querySelector('[data-year="' + editingYearOriginal + '"]');
    if (editingCard) editingCard.classList.remove('editing-year');
  }
  document.getElementById('yearModal').classList.remove('show'); editingYearOriginal = null;
}
function openEntryEditor(year, entryId) {
  editingYear = year; editingEntryId = entryId || null;
  var entry = entryId && (state.entries[year] || []).find(function(item) { return item.id === entryId; });
  document.getElementById('dateInput').value = entry ? entry.date : year + '-01-15';
  document.getElementById('entryTitleInput').value = entry ? entry.title : '';
  document.getElementById('contentInput').value = entry ? entry.content : '';
  document.getElementById('editorTitle').textContent = entry ? '编辑经历' : year + ' 年 · 新增经历';
  document.getElementById('deleteButton').hidden = !entry;
  setEntryExpanded(false);
  document.getElementById('modal').classList.add('show');
  document.getElementById('entryTitleInput').focus();
}
function setEntryExpanded(expanded) {
  var editor = document.querySelector('.entry-editor');
  var button = document.getElementById('expandButton');
  editor.classList.toggle('expanded', expanded);
  button.setAttribute('aria-expanded', String(expanded));
  button.textContent = expanded ? '缩小编辑' : '展开编辑';
}
function closeEditor() { setEntryExpanded(false); document.getElementById('modal').classList.remove('show'); editingYear = null; editingEntryId = null; }
function toggleEntryExpansion() { setEntryExpanded(!document.querySelector('.entry-editor').classList.contains('expanded')); }
function restoreYearPosition(year) {
  var timeline = document.getElementById('timeline');
  var card = document.querySelector('[data-year="' + year + '"]');
  if (!card) return;
  var timelineTop = timeline.getBoundingClientRect().top;
  var cardTop = card.getBoundingClientRect().top;
  timeline.scrollTop = Math.max(0, timeline.scrollTop + cardTop - timelineTop - timeline.clientHeight * 0.3);
}
function render() {
  var timeline = document.getElementById('timeline'); timeline.textContent = '';
  updateRangeTitle();
  updateEntryCount();
  years().forEach(function(year) {
    var card = document.createElement('section'); card.className = 'year-card wood-surface wood-3d'; card.dataset.year = year;
    var info = yearInfo(year);
    var starColor = info.starColor || starColors[0];
    card.style.setProperty('--phase-color', yearMarkerColor(year, info));
    card.style.setProperty('--decade-end-color', decadeEndColor(year));
    if (year === 2007 || year === 2017 || year === 2027) card.classList.add('decade-end');
    if (year === new Date().getFullYear()) card.classList.add('current');
    var entries = (state.entries[year] || []).slice().sort(function(a, b) { return a.date.localeCompare(b.date); });
    card.innerHTML = '<button class="timeline-marker" aria-label="更改 ' + year + ' 年的颜色"></button><div class="color-picker" role="dialog" aria-label="选择标记颜色"></div><div class="year-head"><span class="year">' + year + '</span><span class="age">' + ageAtYear(year) + ' 岁</span><div class="year-meta"><div class="year-meta-row"><span class="year-focus-text"></span><span class="year-city-text"></span><button class="star-button" style="color:' + (info.special ? starColor : '#806b52') + '" aria-label="切换特殊年份">' + (info.special ? '★' : '☆') + '</button></div></div></div><div class="year-summary"></div><div class="entry-list"></div>';
    var summary = card.querySelector('.year-summary');
    if (entries.length) summary.textContent = entries.length + ' 条成长记录';
    var focusText = card.querySelector('.year-focus-text');
    var cityText = card.querySelector('.year-city-text');
    focusText.textContent = info.focus;
    cityText.textContent = info.city;
    focusText.hidden = !info.focus;
    cityText.hidden = !info.city;
    card.querySelector('.timeline-marker').addEventListener('click', function(event) { event.stopPropagation(); playWoodClick(); openColorPicker(year, info, card.querySelector('.color-picker')); });
     var starButton = card.querySelector('.star-button');
     starButton.addEventListener('pointerdown', function(event) { event.stopPropagation(); });
     starButton.addEventListener('click', function(event) {
      event.stopPropagation(); playWoodClick();
      if (!info.special) { info.special = true; info.starColor = starColors[0]; }
      else { var starIndex = starColors.indexOf(info.starColor || starColors[0]); if (starIndex === starColors.length - 1) { info.special = false; delete info.starColor; } else info.starColor = starColors[starIndex + 1]; }
      state.yearInfo[year] = info; saveState(); render();
    });
    var longPressed = false;
    var pressTimer = null;
    card.addEventListener('pointerdown', function() { longPressed = false; pressTimer = setTimeout(function() { longPressed = true; openYearEditor(year); }, 600); });
    card.addEventListener('pointerup', function() { clearTimeout(pressTimer); });
    card.addEventListener('pointercancel', function() { clearTimeout(pressTimer); });
    card.addEventListener('click', function() { if (longPressed) { longPressed = false; return; } openYear(year); });
    var list = card.querySelector('.entry-list');
    entries.forEach(function(entry) {
      var row = document.createElement('div'); row.className = 'entry';
      row.innerHTML = '<span class="entry-date">' + entry.date + '</span><div><div class="entry-title"></div><div class="entry-content"></div></div><div class="entry-actions"><button class="small-button">编辑</button></div>';
      row.querySelector('.entry-title').textContent = entry.title;
      row.querySelector('.entry-content').textContent = entry.content;
      row.querySelector('button').addEventListener('click', function(event) { event.stopPropagation(); playWoodClick(); openEntryEditor(year, entry.id); });
      list.appendChild(row);
    });
    var newEntry = document.createElement('button');
    newEntry.className = 'new-entry';
    newEntry.textContent = '＋ 新增经历';
    newEntry.addEventListener('click', function(event) { event.stopPropagation(); playWoodClick(); openEntryEditor(year); });
    list.appendChild(newEntry);
    timeline.appendChild(card);
  });
}
document.getElementById('addYearButton').addEventListener('click', function() {
  openYearEditor();
});
document.getElementById('lifeDurationButton').addEventListener('click', function(event) {
  event.stopPropagation(); durationModeIndex = (durationModeIndex + 1) % durationModes.length; updateLifeStats(); playWoodClick();
});
document.getElementById('yearCancelButton').addEventListener('click', closeYearEditor);
document.getElementById('yearSaveButton').addEventListener('click', function() {
  var year = Number(document.getElementById('yearInput').value);
  if (!year || year < 1900 || year > 2200 || (year !== editingYearOriginal && years().indexOf(year) !== -1)) return;
  var info = Object.assign({}, editingYearOriginal ? yearInfo(editingYearOriginal) : {}, { city: document.getElementById('cityInput').value.trim(), focus: document.getElementById('focusInput').value.trim() });
  if (editingYearOriginal) {
    state.years = state.years.map(function(item) { return item === editingYearOriginal ? year : item; });
    if (editingYearOriginal !== year) { state.entries[year] = state.entries[editingYearOriginal] || []; delete state.entries[editingYearOriginal]; state.yearInfo[year] = info; delete state.yearInfo[editingYearOriginal]; }
    else state.yearInfo[year] = info;
    if (isBaseYear(editingYearOriginal) && state.hiddenYears.indexOf(editingYearOriginal) === -1) state.hiddenYears.push(editingYearOriginal);
  } else { state.years.push(year); state.entries[year] = []; state.yearInfo[year] = info; }
  state.hiddenYears = state.hiddenYears.filter(function(item) { return item !== year; });
  saveState(); closeYearEditor(); render();
});
document.getElementById('yearDeleteButton').addEventListener('click', function() {
  if (!editingYearOriginal) return;
  state.years = state.years.filter(function(item) { return item !== editingYearOriginal; });
  if (isBaseYear(editingYearOriginal) && state.hiddenYears.indexOf(editingYearOriginal) === -1) state.hiddenYears.push(editingYearOriginal);
  delete state.entries[editingYearOriginal]; delete state.yearInfo[editingYearOriginal]; saveState(); closeYearEditor(); render();
});
document.getElementById('cancelButton').addEventListener('click', closeEditor);
document.getElementById('expandButton').addEventListener('click', function(event) { event.stopPropagation(); playWoodClick(); toggleEntryExpansion(); });
document.getElementById('saveButton').addEventListener('click', function() {
  var title = document.getElementById('entryTitleInput').value.trim(); if (!title) return;
  var savedYear = editingYear;
  var entry = { id: editingEntryId || Date.now(), date: document.getElementById('dateInput').value || editingYear + '-01-15', title: title, content: document.getElementById('contentInput').value.trim() };
  if (!state.entries[editingYear]) state.entries[editingYear] = [];
  if (editingEntryId) state.entries[editingYear] = state.entries[editingYear].map(function(item) { return item.id === editingEntryId ? entry : item; }); else state.entries[editingYear].push(entry);
  saveState(); closeEditor(); render(); restoreYearPosition(savedYear);
});
document.getElementById('deleteButton').addEventListener('click', function() {
  var deletedYear = editingYear;
  state.entries[editingYear] = (state.entries[editingYear] || []).filter(function(item) { return item.id !== editingEntryId; }); saveState(); closeEditor(); render(); restoreYearPosition(deletedYear);
});
document.querySelector('.back').addEventListener('click', function() { setTimeout(function() { window.location.href = 'wood-rename.html#' + encodeURIComponent(returnSub); }, 140); });
document.addEventListener('click', function(event) { if (event.target.closest('button, .back, .year-card')) playWoodClick(); });
updateLifeStats();
setInterval(updateLifeStats, 60000);
render();
</script>
