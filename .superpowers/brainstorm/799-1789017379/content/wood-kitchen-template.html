function playWoodClick() {
  var AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  if (!audioContext) audioContext = new AudioContext();
  if (audioContext.state === 'suspended') audioContext.resume();
  var now = audioContext.currentTime;
  var gain = audioContext.createGain();
  var tone = audioContext.createOscillator();
  var body = audioContext.createOscillator();
  tone.type = 'triangle';
  tone.frequency.setValueAtTime(190, now);
  tone.frequency.exponentialRampToValueAtTime(90, now + 0.09);
  body.type = 'sine';
  body.frequency.setValueAtTime(420, now);
  body.frequency.exponentialRampToValueAtTime(150, now + 0.07);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.14, now + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
  tone.connect(gain);
  body.connect(gain);
  gain.connect(audioContext.destination);
  tone.start(now);
  body.start(now);
  tone.stop(now + 0.13);
  body.stop(now + 0.13);
}

  dragId = null;
}
function reorderRecord(id, targetId, before) {
  if (id === targetId) return;
  var categoryRecords = visibleRecords().filter(function(record) { return record.id !== id; });
  var targetIndex = categoryRecords.findIndex(function(record) { return record.id === targetId; });
  var record = records.find(function(item) { return item.id === id; });
  if (!record || targetIndex < 0) return;
  categoryRecords.splice(before ? targetIndex : targetIndex + 1, 0, record);
  var cursor = 0;
  records = records.map(function(item) { return item.category === currentCategory ? categoryRecords[cursor++] : item; });
  saveState();
  render();
}
function openEditor(id, assignmentKey) {
  editingId = id;
  editingAssignment = null;
  var record = records.find(function(item) { return item.id === id; });
  var isDailyMeal = currentCategory === '每日餐食';
  var editor = document.querySelector('.record-editor');
  editor.classList.remove('expanded');
  ['expandButton', 'dailyMealExpandButton'].forEach(function(buttonId) {
    document.getElementById(buttonId).setAttribute('aria-expanded', 'false');
    document.getElementById(buttonId).textContent = '展开编辑';
  });
  document.getElementById('regularRecordFields').hidden = isDailyMeal;
  document.getElementById('dailyMealFields').hidden = !isDailyMeal;
  document.getElementById('nameInput').value = record ? record.name : '';
  document.getElementById('timeInput').value = record && record.time ? record.time : '';
  document.getElementById('noteInput').value = record && record.note ? record.note : '';
  document.getElementById('dailyMealInput').value = record ? record.name : '';
  document.getElementById('editNewInput').checked = record ? statIds('new').indexOf(record.id) !== -1 : false;
  document.getElementById('editDiscardedInput').checked = record ? statIds('discarded').indexOf(record.id) !== -1 : false;
  document.getElementById('editNeedInput').checked = record ? statIds('need').indexOf(record.id) !== -1 : false;
  document.getElementById('editorTitle').textContent = isDailyMeal ? (record ? '编辑餐食记录' : '新增餐食记录') : (record ? '编辑记录' : '新增记录');
  document.getElementById('deleteButton').hidden = !record;
  document.getElementById('deleteButton').textContent = '删除';
  document.getElementById('modal').classList.add('show');
  document.getElementById(isDailyMeal ? 'dailyMealInput' : 'nameInput').focus();
}
function setEditorExpanded(expanded) {
  var editor = document.querySelector('.record-editor');
  var button = document.getElementById(currentCategory === '每日餐食' ? 'dailyMealExpandButton' : 'expandButton');
  editor.classList.toggle('expanded', expanded);
  button.setAttribute('aria-expanded', String(expanded));
  button.textContent = expanded ? '缩小编辑' : '展开编辑';
}
function closeEditor() { editingId = null; editingAssignment = null; document.getElementById('modal').classList.remove('show'); }
document.querySelector('.back').addEventListener('click', function() { window.location.href = 'wood-rename.html#' + encodeURIComponent(returnSub); });
document.addEventListener('click', function(event) {
  var target = event.target.closest('button, .category, .item, .mini-item, .stat, .back');
  if (target) playWoodClick();
});
document.getElementById('sectionTitle').addEventListener('click', openAnnualDetail);
document.getElementById('sectionAddButton').addEventListener('click', function() { openEditor(null); });
document.getElementById('purchaseButton').addEventListener('click', openPurchaseList);
document.getElementById('purchaseClearButton').addEventListener('click', clearPurchaseList);
document.getElementById('purchaseSelectAllButton').addEventListener('click', selectAllPurchaseList);
document.getElementById('purchaseConfirmButton').addEventListener('click', confirmPurchaseList);
document.getElementById('purchaseModal').addEventListener('click', function(event) { if (event.target === this) closePurchaseList(); });
document.getElementById('annualYearButton').addEventListener('click', function(event) {
  event.stopPropagation();
  var picker = document.getElementById('annualYearPicker');
  picker.hidden = !picker.hidden;
  if (!picker.hidden) renderAnnualYears();
});
document.getElementById('annualCloseButton').addEventListener('click', closeAnnualDetail);
document.getElementById('annualModal').addEventListener('click', function(event) { if (event.target === this) closeAnnualDetail(); });
document.getElementById('addCategoryButton').hidden = false;
document.getElementById('addCategoryButton').addEventListener('click', function() { openCategoryEditor(null); });
document.getElementById('categoryCancelButton').addEventListener('click', closeCategoryEditor);
document.getElementById('categorySaveButton').addEventListener('click', function() {
  var name = document.getElementById('categoryNameInput').value.trim();
  if (!name) return;
  if (editingCategory) {
    if (!renameCategory(editingCategory, name)) return;
  } else if (categoryNames.indexOf(name) !== -1) return;
  else { categoryNames.push(name); currentCategory = name; }
  closeCategoryEditor();
  saveState();
  renderCategories();
  render();
});
document.getElementById('categoryDeleteButton').addEventListener('click', function() {
  if (deleteCategory(editingCategory)) closeCategoryEditor();
});
document.getElementById('expandButton').addEventListener('click', function(event) { event.stopPropagation(); setEditorExpanded(!document.querySelector('.record-editor').classList.contains('expanded')); });
document.getElementById('dailyMealExpandButton').addEventListener('click', function(event) { event.stopPropagation(); setEditorExpanded(!document.querySelector('.record-editor').classList.contains('expanded')); });
document.getElementById('cancelButton').addEventListener('click', closeEditor);
document.getElementById('saveButton').addEventListener('click', function() {
  var isDailyMeal = currentCategory === '每日餐食';
  var name = document.getElementById(isDailyMeal ? 'dailyMealInput' : 'nameInput').value.trim();
  var time = isDailyMeal ? '' : document.getElementById('timeInput').value;
  var note = isDailyMeal ? '' : document.getElementById('noteInput').value.trim();
  if (!name) return;
  var savedId = editingId;
  if (editingId) {
    var editingRecord = records.find(function(item) { return item.id === editingId; });
    editingRecord.name = name;
    editingRecord.time = time;
    editingRecord.note = note;
  } else {
    savedId = Date.now();
    records.push({ id: savedId, category: currentCategory, name: name, time: time, note: note, created: time || '', status: 'normal' });
  }
  setStatAssignment('new', savedId, !isDailyMeal && document.getElementById('editNewInput').checked);
  setStatAssignment('discarded', savedId, !isDailyMeal && document.getElementById('editDiscardedInput').checked);
  setStatAssignment('need', savedId, !isDailyMeal && document.getElementById('editNeedInput').checked);
  closeEditor();
  saveState();
  render();
});
document.getElementById('items').addEventListener('dragover', function(event) { event.preventDefault(); });
document.getElementById('items').addEventListener('dragover', function(event) {
  event.preventDefault();
  if (dragMode !== 'item') return;
  var target = event.target.closest('.item');
  clearDropIndicators();
  if (!target || String(target.dataset.id) === String(dragId)) return;
  dragTargetId = Number(target.dataset.id);
  dragInsertBefore = event.clientX < target.getBoundingClientRect().left + target.offsetWidth / 2;
  target.classList.add(dragInsertBefore ? 'insert-before' : 'insert-after');
});
document.getElementById('items').addEventListener('drop', function(event) {
  event.preventDefault();
  if (dragMode !== 'item' || !dragTargetId) return;
  reorderRecord(dragId, dragTargetId, dragInsertBefore);
  clearDropIndicators();
});
document.getElementById('deleteButton').addEventListener('click', function() {
  if (!editingId) return;
  if (editingAssignment) removeAssignment(editingAssignment, editingId);
  else {
    records = records.filter(function(record) { return record.id !== editingId; });
    Object.keys(statAssignments).forEach(function(key) { statAssignments[key] = statAssignments[key].filter(function(id) { return id !== editingId; }); });
    removeFromNewStats(editingId);
    saveState();
    render();
  }
  closeEditor();
});
loadState();
if (categoryNames.indexOf(currentCategory) === -1) currentCategory = categoryNames[0];
renderCategories();
render();
</script>
