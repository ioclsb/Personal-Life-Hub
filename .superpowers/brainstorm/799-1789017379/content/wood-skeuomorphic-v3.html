<h2>个人生活台 — 初始状态</h2>
<p class="subtitle">四个等大方块 2×2 排列</p>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #d6c8a8; }

  .phone-frame {
    width: 375px;
    height: 750px;
    margin: 0 auto;
    background: #2c2c2c;
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
  }
  .phone-screen {
    background: #d6c8a8 !important;
    border-radius: 16px;
    overflow: hidden;
    padding: 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* 木纹表面 */
  .wood-surface {
    background:
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(180,150,110,0.12) 2px,
        rgba(180,150,110,0.12) 3px
      ),
      repeating-linear-gradient(
        88deg,
        transparent,
        transparent 5px,
        rgba(160,130,90,0.08) 5px,
        rgba(160,130,90,0.08) 6px
      ),
      radial-gradient(ellipse 80% 100% at 20% 50%, rgba(210,185,145,0.25), transparent),
      radial-gradient(ellipse 60% 100% at 75% 50%, rgba(195,165,120,0.2), transparent),
      radial-gradient(ellipse 90% 80% at 50% 30%, rgba(220,195,155,0.15), transparent),
      linear-gradient(180deg, #ddc9a5 0%, #d4bc98 30%, #ccb08a 60%, #d8c4a0 100%);
  }

  /* 立体浮雕 */
  .wood-3d {
    border: 1px solid rgba(0,0,0,0.08);
    border-top-color: rgba(255,255,255,0.35);
    border-left-color: rgba(255,255,255,0.25);
    border-bottom-color: rgba(0,0,0,0.12);
    border-right-color: rgba(0,0,0,0.06);
    box-shadow:
      0 2px 3px rgba(0,0,0,0.1),
      0 4px 6px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -1px 2px rgba(0,0,0,0.08),
      inset 1px 0 0 rgba(255,255,255,0.2),
      inset -1px 0 0 rgba(0,0,0,0.04);
  }

  /* 主题方块 */
  .main-block {
    border-radius: 10px;
    padding: 20px 14px 16px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .main-block:active {
    transform: scale(0.97);
  }
  .block-icon {
    font-size: 24px;
    margin-bottom: 5px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
  }
  .block-label {
    font-size: 16px;
    font-weight: 700;
    color: #5a4632;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .block-hint {
    font-size: 10px;
    color: #9a8a70;
    margin-top: 2px;
  }

  /* 2×2 等高网格 */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    flex: 1;
  }
</style>

<div class="phone-frame">
  <div class="phone-screen">

    <div class="grid">
      <div class="main-block wood-surface wood-3d">
        <div class="block-icon">🏠</div>
        <div class="block-label">衣食住行</div>
        <div class="block-hint">日常生活管理</div>
      </div>
      <div class="main-block wood-surface wood-3d">
        <div class="block-icon">🌱</div>
        <div class="block-label">个人成长</div>
        <div class="block-hint">习惯与目标</div>
      </div>
      <div class="main-block wood-surface wood-3d">
        <div class="block-icon">📅</div>
        <div class="block-label">未来计划</div>
        <div class="block-hint">规划与提醒</div>
      </div>
      <div class="main-block wood-surface wood-3d">
        <div class="block-icon">📖</div>
        <div class="block-label">学习思考</div>
        <div class="block-hint">知识与记录</div>
      </div>
    </div>

  </div>
</div>
