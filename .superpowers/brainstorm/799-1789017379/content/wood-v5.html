<h2>个人生活台 — 点击展开 + 返回</h2>
<p class="subtitle">母主题缩窄，子主题可滚动</p>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #d6c8a8; }

  .phone-frame {
    width: 375px;
    height: 750px;
    margin: 0 auto;
    background: #2c2c2c;
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
  }
  .phone-screen {
    background: #d6c8a8 !important;
    border-radius: 16px;
    overflow: hidden;
    padding: 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .wood-surface {
    background:
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(180,150,110,0.12) 2px, rgba(180,150,110,0.12) 3px),
      repeating-linear-gradient(88deg, transparent, transparent 5px, rgba(160,130,90,0.08) 5px, rgba(160,130,90,0.08) 6px),
      radial-gradient(ellipse 80% 100% at 20% 50%, rgba(210,185,145,0.25), transparent),
      radial-gradient(ellipse 60% 100% at 75% 50%, rgba(195,165,120,0.2), transparent),
      radial-gradient(ellipse 90% 80% at 50% 30%, rgba(220,195,155,0.15), transparent),
      linear-gradient(180deg, #ddc9a5 0%, #d4bc98 30%, #ccb08a 60%, #d8c4a0 100%);
  }

  .wood-3d {
    border: 1px solid rgba(0,0,0,0.08);
    border-top-color: rgba(255,255,255,0.35);
    border-left-color: rgba(255,255,255,0.25);
    border-bottom-color: rgba(0,0,0,0.12);
    border-right-color: rgba(0,0,0,0.06);
    box-shadow:
      0 2px 3px rgba(0,0,0,0.1),
      0 4px 6px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -1px 2px rgba(0,0,0,0.08),
      inset 1px 0 0 rgba(255,255,255,0.2),
      inset -1px 0 0 rgba(0,0,0,0.04);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    flex: 1;
  }

  .cell {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* 母主题 */
  .main-block {
    border-radius: 10px;
    padding: 20px 14px 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    flex: 1;
    transition: all 0.25s ease;
  }
  .main-block:active { transform: scale(0.97); }
  .block-icon {
    font-size: 24px;
    margin-bottom: 5px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
  }
  .block-label {
    font-size: 16px;
    font-weight: 700;
    color: #5a4632;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .block-hint {
    font-size: 10px;
    color: #9a8a70;
    margin-top: 2px;
  }

  /* 展开时母主题缩小 */
  .cell.expanded .main-block {
    flex: 0 0 auto;
    padding: 12px 14px 10px;
    border-radius: 10px 10px 0 0;
  }
  .cell.expanded .block-icon { font-size: 18px; margin-bottom: 3px; }
  .cell.expanded .block-label { font-size: 14px; }
  .cell.expanded .block-hint { display: none; }

  /* 子主题容器 */
  .sub-list {
    display: none;
    flex-direction: column;
    gap: 5px;
    max-height: 260px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding: 6px 8px 8px;
    border-radius: 0 0 10px 10px;
  }
  .sub-list::-webkit-scrollbar { display: none; }

  .cell.expanded .sub-list { display: flex; }

  .sub-bar {
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .sub-bar:active { transform: scale(0.96); }
  .bar-label {
    font-size: 12.5px;
    font-weight: 600;
    color: #5a4632;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .bar-arrow { font-size: 11px; color: #a09080; }
</style>

<div class="phone-frame">
  <div class="phone-screen">

    <div class="row">
      <!-- 衣食住行 -->
      <div class="cell" id="cell1">
        <div class="main-block wood-surface wood-3d" onclick="toggleCell('cell1')">
          <div class="block-icon">🏠</div>
          <div class="block-label">衣食住行</div>
          <div class="block-hint">日常生活管理</div>
        </div>
        <div class="sub-list wood-surface wood-3d">
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">衣橱管理</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">生活消耗</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">食材库存</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">出行清单</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">家居物品</span><span class="bar-arrow">›</span></div>
        </div>
      </div>
      <!-- 个人成长 -->
      <div class="cell" id="cell2">
        <div class="main-block wood-surface wood-3d" onclick="toggleCell('cell2')">
          <div class="block-icon">🌱</div>
          <div class="block-label">个人成长</div>
          <div class="block-hint">习惯与目标</div>
        </div>
        <div class="sub-list wood-surface wood-3d">
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">每日打卡</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">习惯追踪</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">目标进度</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">成长日志</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">年度总结</span><span class="bar-arrow">›</span></div>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- 未来计划 -->
      <div class="cell" id="cell3">
        <div class="main-block wood-surface wood-3d" onclick="toggleCell('cell3')">
          <div class="block-icon">📅</div>
          <div class="block-label">未来计划</div>
          <div class="block-hint">规划与提醒</div>
        </div>
        <div class="sub-list wood-surface wood-3d">
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">节日生日</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">旅行清单</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">重要证件</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">待办事项</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">订阅管理</span><span class="bar-arrow">›</span></div>
        </div>
      </div>
      <!-- 学习思考 -->
      <div class="cell" id="cell4">
        <div class="main-block wood-surface wood-3d" onclick="toggleCell('cell4')">
          <div class="block-icon">📖</div>
          <div class="block-label">学习思考</div>
          <div class="block-hint">知识与记录</div>
        </div>
        <div class="sub-list wood-surface wood-3d">
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">书影音 · 豆瓣</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">收藏夹</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">学习笔记</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">灵感碎片</span><span class="bar-arrow">›</span></div>
          <div class="sub-bar wood-surface wood-3d"><span class="bar-label">课程记录</span><span class="bar-arrow">›</span></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
function toggleCell(id) {
  var cell = document.getElementById(id);
  cell.classList.toggle('expanded');
}
</script>
