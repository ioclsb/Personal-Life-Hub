<script>
var timer = null;
var isEditing = false;
var activeSub = null;
var startPoint = null;
var dragReady = false;
var isDragging = false;
var justDragged = false;
var subEditingLabel = null;
var subAddingCell = null;
var savedSubVisibility = {};
var subIdSeed = 0;
var audioContext = null;
var storageKey = 'personal-life-hub-state-v2';

function toggleCell(id) {
  if (isEditing) return;
  document.getElementById(id).classList.toggle('expanded');
}

var clickTimer = null;

function handleMainClick(e, id) {
  if (isEditing) return;
  if (clickTimer) clearTimeout(clickTimer);
  clickTimer = setTimeout(function() {
    playWoodClick();
    toggleCell(id);
    clickTimer = null;
  }, 80);
}

function playWoodClick() {
  var AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  if (!audioContext) audioContext = new AudioContext();
  if (audioContext.state === 'suspended') audioContext.resume();

  var now = audioContext.currentTime;
  var gain = audioContext.createGain();
  var tone = audioContext.createOscillator();
  var body = audioContext.createOscillator();

  tone.type = 'triangle';
  tone.frequency.setValueAtTime(190, now);
  tone.frequency.exponentialRampToValueAtTime(90, now + 0.09);
  body.type = 'sine';
  body.frequency.setValueAtTime(420, now);
  body.frequency.exponentialRampToValueAtTime(150, now + 0.07);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.14, now + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

  tone.connect(gain);
  body.connect(gain);
  gain.connect(audioContext.destination);
  tone.start(now);
  body.start(now);
  tone.stop(now + 0.13);
  body.stop(now + 0.13);
}

function openKitchenTemplate(e) {
  if (justDragged || isEditing) return;

  navigateWithWoodClick('wood-kitchen-template.html?return=sub1b');
}

  navigateWithWoodClick('wood-kitchen-template.html?type=other&return=sub1e');

function openGenericSubTemplate(e, labelId) {
  if (justDragged || isEditing) return;
  navigateWithWoodClick(customSubTemplate(labelId));
}

function customSubTemplate(labelId) {
  var label = document.getElementById(labelId);
  var title = label ? label.textContent.trim() : '';
  return 'wood-kitchen-template.html?type=custom&return=' + encodeURIComponent(labelId) + '&title=' + encodeURIComponent(title);
}

function openPersonalTemplate(e) {
  if (justDragged || isEditing) return;
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
  navigateWithWoodClick('wood-kitchen-template.html?type=personal&return=sub1a');
}

function openLifeTimeline(e) {
  if (justDragged || isEditing) return;
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
  navigateWithWoodClick('wood-life-timeline.html?return=sub2a');
}

function navigateWithWoodClick(url) {
  if (clickTimer) clearTimeout(clickTimer);
  playWoodClick();
  clickTimer = setTimeout(function() {
    window.location.href = url;
    clickTimer = null;
  }, 300);
}

function renameOnDoubleClick(e, labelId) {
  e.preventDefault();
  e.stopPropagation();
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
  cancelTimer();
  openSubEditor(labelId);
}

function renameMainOnDoubleClick(e, labelId) {
  e.preventDefault();
  e.stopPropagation();
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
  isEditing = true;
  var el = document.getElementById(labelId);
  var oldText = el.textContent;
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'rename-input';
  input.value = oldText;
  input.style.fontSize = getComputedStyle(el).fontSize;
  input.style.fontWeight = getComputedStyle(el).fontWeight;
  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();
  function finish() {
    el.textContent = input.value.trim() || oldText;
    isEditing = false;
    saveState();
  }
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') input.blur();
  });
}

function startTimerSub(e, labelId) {
  if (isEditing) return;
  e.stopPropagation();
  cancelTimer();
  activeSub = e.currentTarget;
  startPoint = getPoint(e);
  dragReady = false;
  isDragging = false;
  timer = setTimeout(function() {
    dragReady = true;
  }, 500);
}

function cancelTimer() {
  if (timer) { clearTimeout(timer); timer = null; }
  if (!isDragging) {
    activeSub = null;
    startPoint = null;
    dragReady = false;
  }
}

function getPoint(e) {
  var source = e.touches && e.touches.length ? e.touches[0] : e;
  return { x: source.clientX, y: source.clientY };
}

function moveSub(e) {
  if (!activeSub || isEditing || !startPoint) return;
  var point = getPoint(e);
  var distance = Math.hypot(point.x - startPoint.x, point.y - startPoint.y);
  if (!isDragging) {
    if (!dragReady || distance < 8) return;
    isDragging = true;
    if (timer) { clearTimeout(timer); timer = null; }
    activeSub.classList.add('dragging');
  }
  e.preventDefault();
  var target = document.elementFromPoint(point.x, point.y);
  var targetBar = target && target.closest ? target.closest('.sub-bar') : null;
  if (!targetBar || targetBar === activeSub || targetBar.parentNode !== activeSub.parentNode) return;
  targetBar.classList.add('drop-target');
  var rect = targetBar.getBoundingClientRect();
  if (point.y < rect.top + rect.height / 2) {
    targetBar.parentNode.insertBefore(activeSub, targetBar);
  } else {
    targetBar.parentNode.insertBefore(activeSub, targetBar.nextSibling);
  }
  document.querySelectorAll('.sub-bar.drop-target').forEach(function(bar) {
    if (bar !== targetBar) bar.classList.remove('drop-target');
  });
}

function finishSubDrag() {
  if (!activeSub) return;
  var changed = isDragging;
  if (isDragging) {
    justDragged = true;
    setTimeout(function() { justDragged = false; }, 150);
  }
  activeSub.classList.remove('dragging');
  document.querySelectorAll('.sub-bar.drop-target').forEach(function(bar) {
    bar.classList.remove('drop-target');
  });
  isDragging = false;
  activeSub = null;
  startPoint = null;
  dragReady = false;
  if (changed) saveState();
}

document.addEventListener('mousemove', moveSub);
document.addEventListener('touchmove', moveSub, { passive: false });
document.addEventListener('mouseup', finishSubDrag);
document.addEventListener('touchend', finishSubDrag);
document.addEventListener('touchcancel', finishSubDrag);
function bindSubBar(bar) {
  bar.addEventListener('click', function(event) {
    if (justDragged || isEditing) return;
    event.preventDefault();
    event.stopPropagation();
    var labelId = bar.querySelector('.bar-label').id;
    var routes = {
      sub1a: 'wood-kitchen-template.html?type=personal&return=sub1a',
      sub1b: 'wood-kitchen-template.html?return=sub1b',
      sub1c: 'wood-kitchen-template.html?type=bath&return=sub1c',
      sub1d: 'wood-kitchen-template.html?type=wardrobe&return=sub1d',
      sub1e: 'wood-kitchen-template.html?type=other&return=sub1e',
      sub2a: 'wood-life-timeline.html?return=sub2a'
    };
    navigateWithWoodClick(routes[labelId] || customSubTemplate(labelId));
  });
  bar.addEventListener('dblclick', function(e) {
    var label = bar.querySelector('.bar-label');
    renameOnDoubleClick(e, label.id);
  });
}
document.querySelectorAll('.sub-bar').forEach(bindSubBar);

function openSubEditor(labelId, cellId) {
  var label = labelId ? document.getElementById(labelId) : null;
  subEditingLabel = label;
  subAddingCell = cellId ? document.getElementById(cellId) : null;
  document.getElementById('subEditorTitle').textContent = label && label.textContent.trim() ? '编辑子主题' : '新增主题';
  document.getElementById('subEditorInput').value = label ? label.textContent : '';
  document.getElementById('subEditorDeleteButton').hidden = !label || !label.textContent.trim();
  document.getElementById('subEditorModal').classList.add('show');
  document.getElementById('subEditorInput').focus();
}

function closeSubEditor() {
  subEditingLabel = null;
  subAddingCell = null;
  document.getElementById('subEditorModal').classList.remove('show');
}

function deleteSubTheme() {
  if (!subEditingLabel) return;
  subEditingLabel.textContent = '';
  subEditingLabel.closest('.sub-bar').hidden = true;
  closeSubEditor();
  saveState();
}

function createSubBar(cell, id) {
  var bar = document.createElement('div');
  var labelId = id || cell.id + '-sub-' + Date.now() + '-' + (++subIdSeed);
  bar.className = 'sub-bar wood-surface wood-3d';
  bar.id = labelId + '-bar';
  bar.setAttribute('onmousedown', "startTimerSub(event,'" + labelId + "')");
  bar.setAttribute('onmouseup', 'cancelTimer()');
  bar.setAttribute('onmouseleave', 'cancelTimer()');
  bar.setAttribute('ontouchstart', "startTimerSub(event,'" + labelId + "')");
  bar.setAttribute('ontouchend', 'cancelTimer()');
  bar.innerHTML = '<span class="bar-label" id="' + labelId + '"></span><span class="bar-arrow">›</span>';
  var list = cell.querySelector('.sub-list');
  var addButton = list.querySelector('.add-sub-button');
  list.insertBefore(bar, addButton || null);
  bindSubBar(bar);
  return bar;
}

function addSubTheme(cell) {
  var emptyBar = Array.from(cell.querySelectorAll('.sub-bar')).find(function(bar) {
    return bar.hidden && !bar.querySelector('.bar-label').textContent.trim();
  });
  if (!emptyBar) emptyBar = createSubBar(cell);
  emptyBar.hidden = false;
  openSubEditor(emptyBar.querySelector('.bar-label').id, cell.id);
}

document.querySelectorAll('.sub-list').forEach(function(list) {
  list.querySelectorAll('.sub-bar').forEach(function(bar) {
    bar.hidden = !bar.querySelector('.bar-label').textContent.trim();
  });
  var addButton = document.createElement('button');
  addButton.className = 'add-sub-button';
  addButton.type = 'button';
  addButton.textContent = '+ 新增主题';
  addButton.addEventListener('click', function(event) {
    event.stopPropagation();
    addSubTheme(list.closest('.cell'));
  });
   list.appendChild(addButton);
});

document.getElementById('subEditorDeleteButton').addEventListener('click', deleteSubTheme);
document.getElementById('subEditorCancelButton').addEventListener('click', closeSubEditor);
document.getElementById('subEditorSaveButton').addEventListener('click', function() {
  var value = document.getElementById('subEditorInput').value.trim();
  if (subEditingLabel) {
    subEditingLabel.textContent = value;
    subEditingLabel.closest('.sub-bar').hidden = false;
  } else if (subAddingCell) {
    addSubTheme(subAddingCell);
    if (subEditingLabel) subEditingLabel.textContent = value;
  }
  closeSubEditor();
  saveState();
});

function saveState() {
  var state = { labels: {}, orders: {}, visible: {} };
  document.querySelectorAll('.block-label, .bar-label').forEach(function(label) {
    state.labels[label.id] = label.textContent;
  });
  document.querySelectorAll('.sub-list').forEach(function(list) {
    state.orders[list.parentElement.id] = Array.from(list.querySelectorAll('.bar-label')).map(function(label) {
      return label.id;
    });
    list.querySelectorAll('.sub-bar').forEach(function(bar) {
      var label = bar.querySelector('.bar-label');
      state.visible[label.id] = !bar.hidden;
    });
  });
  var serialized = JSON.stringify(state);
  try { localStorage.setItem(storageKey, serialized); } catch (error) {}
  try { sessionStorage.setItem(storageKey, serialized); } catch (error) {}
}

function loadState() {
  var state;
  try {
    state = JSON.parse(sessionStorage.getItem(storageKey) || localStorage.getItem(storageKey) || 'null');
  } catch (error) {
    state = null;
  }
  if (!state) return;
  savedSubVisibility = state.visible || {};

  Object.keys(state.labels || {}).forEach(function(id) {
    var label = document.getElementById(id);
    if (label) label.textContent = state.labels[id];
  });
  Object.keys(state.orders || {}).forEach(function(cellId) {
    var list = document.querySelector('#' + cellId + ' .sub-list');
    if (!list) return;
    state.orders[cellId].forEach(function(labelId) {
      var bar = document.getElementById(labelId);
      if (!bar) {
        var cell = document.getElementById(cellId);
        if (cell) bar = createSubBar(cell, labelId).parentElement;
      }
      var label = document.getElementById(labelId);
      if (label && Object.prototype.hasOwnProperty.call(state.labels || {}, labelId)) label.textContent = state.labels[labelId];
      if (bar) list.appendChild(bar.classList.contains('sub-bar') ? bar : bar.parentElement);
    });
  });
}

loadState();
document.querySelectorAll('.sub-bar').forEach(function(bar) {
  var label = bar.querySelector('.bar-label');
  bar.hidden = Object.prototype.hasOwnProperty.call(savedSubVisibility, label.id) ? !savedSubVisibility[label.id] : !label.textContent.trim();
});
document.querySelectorAll('.sub-list').forEach(function(list) {
  var addButton = list.querySelector('.add-sub-button');
  if (addButton) list.appendChild(addButton);
});
openReturnSub();

function openReturnSub() {
  var subId = window.location.hash.slice(1);
  if (!subId) return;
  history.replaceState(null, '', window.location.pathname + window.location.search);
  var sub = document.getElementById(subId);
  if (!sub) return;
  var cell = sub.closest('.cell');
  if (cell) cell.classList.add('expanded');
  window.scrollTo(0, 0);
}

</script>
